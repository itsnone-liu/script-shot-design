<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课件生成 —— 教案 × PPT 模板</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3c;
  --fg:#e8eaf0; --dim:#9aa3b5; --acc:#5b9dff; --ok:#3ecf8e; --warn:#e6b455;
  --err:#ef6b6b; --chip:#232838;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:18px}
header{display:flex;align-items:baseline;gap:12px;padding:4px 2px 12px;flex-wrap:wrap}
header h1{font-size:19px;margin:0}
header .sub{color:var(--dim);font-size:12px}
#health{margin-left:auto;font-size:12px;color:var(--dim)}
#health b{font-weight:600}
#health .ok{color:var(--ok)} #health .bad{color:var(--err)}
.grid{display:grid;grid-template-columns:minmax(340px,4fr) minmax(430px,8fr);gap:16px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;
  letter-spacing:.4px}
.card h3{font-size:13px;margin:14px 0 8px;color:var(--fg)}
textarea{width:100%;min-height:150px;background:var(--panel2);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;
  resize:vertical;font-family:inherit;line-height:1.5}
input[type=text],input[type=number],select{background:var(--panel2);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;
  font-family:inherit;width:100%}
button{background:var(--acc);border:none;color:#fff;border-radius:8px;
  padding:10px 18px;font-size:14px;cursor:pointer;font-family:inherit}
button.sec{background:var(--panel2);border:1px solid var(--line);color:var(--fg)}
button.ok{background:var(--ok)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.modes{display:flex;gap:8px;margin-bottom:10px}
.mode{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;
  cursor:pointer;background:var(--panel2);font-size:13px;line-height:1.4}
.mode.on{border-color:var(--acc);background:#1a2436}
.mode .t{font-weight:600}
.mode .d{color:var(--dim);font-size:11px;margin-top:3px}
.drop{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;
  cursor:pointer;background:var(--panel2);color:var(--dim)}
.drop.has{border-style:solid;border-color:var(--ok);color:var(--fg)}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;
  background:var(--chip);color:var(--dim)}
.pill.acc{color:var(--acc)} .pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sw{width:26px;height:26px;border-radius:6px;border:1px solid var(--line)}
.stylecard{font-size:13px;line-height:1.65;white-space:pre-wrap;
  background:var(--panel2);border-radius:8px;padding:10px 12px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;max-height:340px;overflow-y:auto;padding-right:4px}
.cat .item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;cursor:pointer}
.cat .item.sel{border-color:var(--acc)}
.cat img{width:100%;aspect-ratio:16/9;display:block;background:#000}
.cat .cap{padding:5px 8px;font-size:11px;color:var(--dim);display:flex;
  justify-content:space-between;gap:4px}
.pages{display:flex;flex-direction:column;gap:14px}
.page{background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  padding:10px}
.page .head{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.page .head b{font-size:13px}
.page img.prev{width:100%;border-radius:8px;border:1px solid var(--line);
  display:block;margin-top:8px;background:#000}
.page .bullets{color:var(--dim);font-size:12px;line-height:1.6;margin:2px 0 6px 6px}
.page .rev{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.page .rev input[type=text]{flex:2;min-width:160px}
.page .rev select{flex:1;min-width:120px}
.page .rev button{padding:8px 12px;font-size:12px}
.warnbox{color:var(--warn);font-size:12px;margin-top:8px;line-height:1.5}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--dim);
  border-top-color:var(--acc);border-radius:50%;animation:r 1s linear infinite;
  vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
.log{font-size:11px;color:var(--dim);line-height:1.7;max-height:120px;
  overflow-y:auto;font-family:Consolas,monospace}
.hidden{display:none}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;
  align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh}
.empty{color:var(--dim);font-size:13px;padding:8px 2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>课件生成</h1>
    <span class="sub">教案 / 课件文字 × PPT 模板 → 可编辑 PPTX（模板识别：PPT-Template-Lab）</span>
    <span id="health">检查服务中…</span>
  </header>

  <div class="grid">
    <!-- 左列：输入 -->
    <div>
      <div class="card">
        <h2>① 内容来源</h2>
        <div class="modes">
          <div class="mode on" id="m-lesson" onclick="setMode('lesson_plan')">
            <div class="t">教案内容</div>
            <div class="d">AI 仍需把教案转成课件文字（每页标题+要点）</div>
          </div>
          <div class="mode" id="m-text" onclick="setMode('courseware_text')">
            <div class="t">课件文字内容</div>
            <div class="d">已有分页文字，直接套模板（支持 JSON / Markdown）</div>
          </div>
        </div>
        <textarea id="src" placeholder="粘贴教案或课件文字内容…
（Markdown 按标题分页；JSON 需含 slides 数组）"></textarea>
        <div class="row" id="lessonOpts">
          <input type="number" id="slideTarget" placeholder="目标页数(可选)" min="0" max="50" style="width:140px">
          <input type="text" id="instr" placeholder="补充要求（可选）：侧重、风格、页数…">
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>② PPT 模板（.pptx）</h2>
        <div class="drop" id="drop" onclick="document.getElementById('file').click()">
          点击选择模板文件 —— AI 将识别布局、风格、色彩、字体</div>
        <input type="file" id="file" accept=".pptx" class="hidden"
               onchange="uploadTemplate(this)">
        <div class="row">
          <button onclick="createProject()" id="btnCreate" disabled>③ 生成课件</button>
          <span id="stCreate" class="pill"></span>
        </div>
        <div class="warnbox" id="tplWarn"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>执行记录</h2>
        <div class="log" id="log">等待任务…</div>
      </div>
    </div>

    <!-- 右列：模板分析 + 课件 -->
    <div>
      <div class="card">
        <h2>模板分析 <span id="tplBadge" class="pill"></span></h2>
        <div id="tplInfo" class="empty">上传模板后显示风格卡与页面目录</div>
        <div id="styleBox" class="hidden">
          <h3>风格卡（色彩 / 字体 / 版式）</h3>
          <div class="swatches" id="swatches"></div>
          <div class="stylecard" id="styleText"></div>
          <h3>页面目录 <span class="pill" id="catCount"></span></h3>
          <div class="cat" id="catalog"></div>
        </div>
      </div>

      <div class="card" style="margin-top:14px">
        <h2>课件 <span id="deckBadge" class="pill"></span>
          <button class="sec hidden" id="btnBuild" style="float:right;padding:6px 14px;font-size:12px"
            onclick="buildDeck()">套用模板生成 PPT</button>
          <button class="ok hidden" id="btnDl" style="float:right;margin-right:8px;padding:6px 14px;font-size:12px"
            onclick="location.href='/api/projects/'+pid+'/download'">下载 PPTX</button>
        </h2>
        <div id="deckBox" class="empty">生成后在此逐页预览与修订</div>
        <div class="pages" id="pages"></div>
      </div>
    </div>
  </div>
</div>

<script>
let mode='lesson_plan', tpl=null, pid=null, state=null, busy=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function log(msg){const el=$('log');
  el.innerHTML+=`<div>${new Date().toLocaleTimeString()} ${esc(msg)}</div>`;
  el.scrollTop=el.scrollHeight;}
function setBusy(b,label){
  busy=b;
  for(const id of ['btnCreate','btnBuild'])
    $(id).disabled = b || (id==='btnCreate'&&!tpl) || (id==='btnBuild'&&!pid);
  if(label!==undefined) $(b?'stCreate':'deckBadge').innerHTML =
    b?`<span class="spin"></span>${esc(label)}`:'';
}

async function health(){
  try{
    const h=await (await fetch('/api/health')).json();
    $('health').innerHTML =
      `lab <b class="${h.lab.ok?'ok':'bad'}">${h.lab.ok?'在线':'离线'}</b> · ` +
      `LLM <b class="${h.llm.configured?'ok':'bad'}">${h.llm.configured?esc(h.llm.model):'未配置'}</b>`;
    if(!h.lab.ok) log('警告：PPT-Template-Lab 未运行（'+h.lab.url+'），模板分析不可用');
  }catch(e){ $('health').innerHTML='<b class="bad">服务异常</b>'; }
}
health(); setInterval(health, 15000);

function setMode(m){
  mode=m;
  $('m-lesson').classList.toggle('on',m==='lesson_plan');
  $('m-text').classList.toggle('on',m==='courseware_text');
  $('lessonOpts').classList.toggle('hidden',m!=='lesson_plan');
}

async function uploadTemplate(inp){
  const f=inp.files[0]; if(!f) return;
  $('tplWarn').textContent='';
  $('drop').innerHTML=`<span class="spin"></span>上传并分析模板（识别布局/风格/色彩/字体，可能需要 1-3 分钟）…`;
  const fd=new FormData(); fd.append('file',f);
  try{
    const r=await fetch('/api/templates',{method:'POST',body:fd});
    const j=await r.json();
    if(!r.ok){ throw new Error(j.detail||JSON.stringify(j)); }
    tpl=j; renderTemplate(j); log(`模板导入完成：${j.slide_count} 页`);
    $('btnCreate').disabled=false;
  }catch(e){
    $('drop').textContent='上传失败，点击重试';
    $('tplWarn').textContent='模板上传/分析失败：'+e.message;
    log('模板失败：'+e.message);
  }
}

function renderTemplate(t){
  $('drop').classList.add('has');
  $('drop').innerHTML=`${esc(t.name)} —— ${t.slide_count} 页 · 点击更换`;
  $('tplInfo').classList.add('hidden');
  $('styleBox').classList.remove('hidden');
  $('tplBadge').textContent=t.template_id.slice(0,8);
  // swatches: theme colors first, then high-freq run colors
  const runs=(t.style_card.runs||{}).colors||[];
  const hexes=[...(t.style_card.palette||[]),...runs.map(c=>c.hex)].slice(0,14);
  $('swatches').innerHTML=hexes.map(h=>
    `<div class="sw" style="background:${esc(h)}" title="${esc(h)}"></div>`).join('');
  const fonts=[...((t.style_card.theme||{}).major_font?[`标题字体: ${t.style_card.theme.major_font||'—'}`]:[]),
    `正文字体: ${(t.style_card.theme||{}).minor_font||'—'}`,
    ...(((t.style_card.runs||{}).fonts)||[]).slice(0,4).map(f=>f.name)].join(' · ');
  $('styleText').textContent=(t.style_card.summary||'')+
    `\n\n字体信号：${fonts}`;
  const cat=(t.catalog||[]);
  $('catCount').textContent=cat.length+' 页';
  $('catalog').innerHTML=cat.map(s=>{
    const cls=s.classification||{};
    return `<div class="item" title="参考页 ${s.index}：${cls.layout_label||''}，${(s.slots||[]).length} 槽" onclick="lb('/api/templates/${tpl.template_id}/slides/${s.index}/preview',true)">
      <img loading="lazy" src="/api/templates/${tpl.template_id}/slides/${s.index}/preview">
      <div class="cap"><span>#${s.index}</span><span>${esc(cls.layout_label||'')}</span>
        <span>${(s.slots||[]).length}槽</span></div></div>`;
  }).join('');
}

async function createProject(){
  const src=$('src').value.trim();
  if(!src){alert('请先填写内容');return;}
  if(!tpl){alert('请先上传模板');return;}
  setBusy(true,'生成课件文字…'); log('创建项目（mode='+mode+'）…');
  try{
    const body={mode,source_text:src,
      template:{template_id:tpl.template_id,name:tpl.name}};
    if(mode==='lesson_plan'){
      const n=parseInt($('slideTarget').value||'0',10);
      if(n) body.slide_target=n;
      body.instructions=$('instr').value;
    }
    const r=await fetch('/api/projects',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||JSON.stringify(j));
    pid=j.id; state=j;
    log(`课件文字就绪：${j.deck.slides.length} 页（${esc(j.title)}）`);
    renderDeck();
  }catch(e){ alert('失败：'+e.message); log('创建失败：'+e.message); }
  setBusy(false);
}

function renderDeck(){
  $('deckBox').classList.add('hidden');
  const slides=state.deck.slides;
  $('deckBadge').textContent=`${state.title} · ${slides.length} 页`;
  $('btnBuild').classList.remove('hidden');
  const mapping=state.mapping||[];
  $('pages').innerHTML=slides.map((s,i)=>{
    const m=mapping.find(x=>x.page_id===s.id)||{};
    const prev=m.source_slide?`<img class="prev" loading="lazy"
      src="/api/projects/${pid}/previews/${i+1}"
      onclick="lb(this.src)">`:'';
    const opts=(tpl?(tpl.catalog||[]):[]).map(c=>
      `<option value="${c.index}" ${c.index===m.source_slide?'selected':''}>#${c.index}
       ${(c.classification||{}).layout_label||''}</option>`).join('');
    return `<div class="page" id="pg-${esc(s.id)}">
      <div class="head"><span class="pill acc">${esc(s.type)}</span>
        <b>${esc(s.title)}</b>
        ${m.source_slide?`<span class="pill">模板页 #${m.source_slide}
          ${esc(m.layout||'')}</span>`:''}
        ${m.note?`<span class="pill warn">${esc(m.note)}</span>`:''}</div>
      ${s.subtitle?`<div style="color:var(--dim);font-size:12px">${esc(s.subtitle)}</div>`:''}
      ${s.bullets&&s.bullets.length?`<ul class="bullets">"+
        ${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`:''}
      ${prev}
      ${m.source_slide?`<div class="rev">
        <input type="text" placeholder="修改意见：如 标题太长、要点换行、换成两栏…" id="ins-${esc(s.id)}">
        <select id="ref-${esc(s.id)}"><option value="">换参考页…</option>${opts}</select>
        <button class="sec" onclick="revise('${esc(s.id)}')">修订本页</button>
      </div>`:''}
    </div>`;
  }).join('');
}

async function buildDeck(){
  if(!pid) return;
  setBusy(true,'映射槽位并生成 PPT（OOXML 套版+渲染预览）…'); log('开始套用模板…');
  try{
    const r=await fetch(`/api/projects/${pid}/build`,{method:'POST'});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||JSON.stringify(j));
    state=j; renderDeck();
    const q=(state.lab&&state.lab.quality)||null;
    const warn=q&&q.warnings?`（警告 ${q.warnings.length} 条）`:'';
    log(`PPT 生成完成${warn}：${state.lab.slide_count} 页，revision ${state.lab.revision}`);
    $('btnDl').classList.remove('hidden');
  }catch(e){ alert('失败：'+e.message); log('生成失败：'+e.message); }
  setBusy(false);
}

async function revise(pageId){
  const ins=$('ins-'+pageId).value.trim();
  const ref=$('ref-'+pageId).value;
  if(!ins&&!ref){alert('写修改意见或选新参考页');return;}
  setBusy(true,'修订单页…'); log(`修订 ${pageId}：${ins||('换参考页 #'+ref)}`);
  try{
    const body={instruction:ins};
    if(ref) body.source_slide=parseInt(ref,10);
    const r=await fetch(`/api/projects/${pid}/pages/${pageId}/revise`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok) throw new Error(j.detail||JSON.stringify(j));
    state=j; renderDeck();
    log(`修订完成 -> revision ${state.lab.revision}`);
  }catch(e){ alert('失败：'+e.message); log('修订失败：'+e.message); }
  setBusy(false);
}

function lb(src,isSvg){
  const d=document.createElement('div'); d.id='lightbox';
  d.innerHTML = isSvg
    ? `<object type="image/svg+xml" data="${src}" style="max-width:96vw;max-height:96vh"></object>`
    : `<img src="${src}">`;
  d.onclick=()=>d.remove(); document.body.appendChild(d);
}
</script>
</body>
</html>
